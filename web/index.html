<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F2F1EC;font-family:'Pretendard',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1F1D1A}
a{color:#A61E4D;text-decoration:none}
button{font-family:inherit}
input,button,select,textarea{font-family:'Pretendard',system-ui,sans-serif}
::placeholder{color:#9C988C}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
.card{background:#FFFFFF;border:1px solid #E5E3DC;border-radius:12px}
.run:hover{background:#5F0E26 !important}
.hoverbg:hover{background:#F2F1EC}
.homecard:hover{border-color:#C9C6BC !important}
.linkbtn{background:none;border:none;padding:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D9D6CD;border-radius:8px}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

// ── 디자인 상수 (DC 시안과 동일 스타일) ─────────────────────────
const C = {
  bg:'#F2F1EC', panel:'#FFFFFF', line:'#E5E3DC', line2:'#F2F1EC',
  ink:'#0E0D0B', ink2:'#1F1D1A', sub:'#6E6A60', mute:'#9C988C',
  wine:'#8A1538', wine2:'#A61E4D', wineBg:'#F4E3E8', canvas:'#FAFAF7',
  ok:'#17766B', okBg:'#DFEEEC', warn:'#9C4220', warnBg:'#F6E6DE', err:'#C2542A'
};
const INPUT_BASE = 'width:100%;height:40px;padding:0 12px;border-radius:8px;background:#FFFFFF;font-size:14px;color:#1F1D1A;outline:none;border:1px solid ';
const SEG_ON  = 'flex:1;height:30px;padding:0 16px;border:none;border-radius:6px;background:#FFFFFF;font-size:13px;font-weight:600;color:#8A1538;cursor:pointer;box-shadow:0 1px 2px rgba(14,13,11,0.04)';
const SEG_OFF = 'flex:1;height:30px;padding:0 16px;border:none;border-radius:6px;background:none;font-size:13px;font-weight:500;color:#6E6A60;cursor:pointer';
const RUN_BASE = 'height:44px;padding:0 24px;border:none;border-radius:8px;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer;transition:background 140ms;background:';
const DROP_BASE = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:36px 24px;border-radius:12px;cursor:pointer;background:#FAFAF7;border:1px dashed ';

// ── 상태 ────────────────────────────────────────────────────
const S = {
  screen: 'home',
  addr: {
    fileName:'', rosterCount:0, roles:[], teams:[], columns:null,
    teamsText:'', target:'to', selTo:[], selCc:[],
    running:false, result:null, errors:[], copied:null, busyMsg:''
  },
  xls: {
    folder:'', prefix:'', sheets:'', headers:'', sub:true,
    running:false, result:null, errors:[]
  },
  fld: {
    fileName:'', sheets:[], sheet:'', headers:[], top:'', sub:'',
    numMode:'digit', outputDir:'', running:false, preview:null,
    result:null, errors:[]
  }
};

// ── 유틸 ────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function POSITION(role){ const r=String(role||'').replace(/\s+/g,'').toLowerCase(); if(!r)return false; if(['팀qa','담당','담당임원'].includes(r))return true; return r.endsWith('장'); }
let _jq=[];
function jlog(msg){
  try{ console.log(msg); }catch(e){}
  try{
    if(window.pywebview && window.pywebview.api && window.pywebview.api.log_js){
      while(_jq.length){ window.pywebview.api.log_js(_jq.shift()); }
      window.pywebview.api.log_js(String(msg));
    } else { _jq.push(String(msg)); }
  }catch(e){ try{ _jq.push(String(msg)); }catch(_){} }
}
window.addEventListener('error', e=>{ jlog('window.onerror: '+(e.message||'')+' @ '+(e.filename||'')+':'+(e.lineno||'')); });
window.addEventListener('unhandledrejection', e=>{ jlog('unhandledrejection: '+((e.reason&&e.reason.message)||e.reason)); });
async function api(method, ...args){
  if(!(window.pywebview && window.pywebview.api)) throw new Error('앱 API가 아직 준비되지 않았습니다.');
  return await window.pywebview.api[method](...args);
}
function copyText(text){
  try{
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }catch(e){ if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{}); }
}

// ── 렌더 ────────────────────────────────────────────────────
const app = document.getElementById('app');

function render(){
  app.innerHTML = shell(screenHtml());
}

function shell(inner){
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;background:${C.canvas}">
    <header style="display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;border-bottom:1px solid ${C.line};background:#FFFFFF;flex:none">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em;color:${C.ink}">업무 도우미</span>
        <span class="mono" style="font-size:10px;color:${C.mute};border:1px solid ${C.line};border-radius:999px;padding:2px 8px">사내용</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:13px;color:${C.sub}">사용자</span>
        <span style="width:30px;height:30px;border-radius:999px;background:${C.wineBg};color:${C.wine};font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">U</span>
      </div>
    </header>
    <div style="display:flex;align-items:stretch;flex:1;min-height:0">
      <aside style="width:220px;flex:none;border-right:1px solid ${C.line};background:#FFFFFF;padding:24px 16px;display:flex;flex-direction:column;gap:4px">
        <div style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:${C.mute};padding:0 12px 12px">도구</div>
        ${sideBtn('home','홈')}
        ${sideBtn('addr','주소록')}
        ${sideBtn('xls','엑셀 취합')}
        ${sideBtn('folder','폴더 생성')}
        <div style="margin-top:auto;padding:16px 12px 0;border-top:1px solid ${C.line};font-size:12px;line-height:1.55;color:${C.mute}">모든 처리는 내 PC 안에서만 이루어집니다.</div>
      </aside>
      <main style="flex:1;min-width:0;padding:40px 48px 64px;overflow:auto">${inner}</main>
    </div>
  </div>`;
}

function sideBtn(key,label){
  const on = S.screen===key;
  const st = 'text-align:left;width:100%;padding:11px 12px;border:none;border-radius:8px;cursor:pointer;font-size:14px;'
    + (on ? `font-weight:600;color:${C.wine};background:${C.wineBg}` : `font-weight:500;color:#3F3C36;background:none`);
  return `<button class="${on?'':'hoverbg'}" data-action="nav" data-key="${key}" style="${st}">${label}</button>`;
}

function screenHtml(){
  if(S.screen==='home') return homeHtml();
  if(S.screen==='addr') return addrHtml();
  if(S.screen==='xls') return xlsHtml();
  if(S.screen==='folder') return folderHtml();
  return '';
}

// ── 홈 ──────────────────────────────────────────────────────
function homeHtml(){
  const card = (key,no,title,desc)=>`
    <button class="homecard" data-action="nav" data-key="${key}" style="text-align:left;cursor:pointer;background:#FFFFFF;border:1px solid ${C.line};border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:12px;transition:border-color 200ms">
      <span class="mono" style="font-size:11px;color:${C.mute}">${no}</span>
      <span style="font-size:22px;font-weight:600;letter-spacing:-0.01em;color:${C.ink}">${title}</span>
      <span style="font-size:14px;line-height:1.55;color:${C.sub}">${desc}</span>
      <span style="margin-top:8px;font-size:13px;font-weight:600;color:${C.wine2}">열기 →</span>
    </button>`;
  return `
  <div style="max-width:1000px">
    <div style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:${C.wine2};margin-bottom:20px">업무 도움 도구</div>
    <h1 style="margin:0;font-size:40px;font-weight:600;line-height:1.2;letter-spacing:-0.025em;color:${C.ink}">반복 작업 세 가지를<br>클릭 몇 번으로 끝냅니다.</h1>
    <p style="margin:18px 0 0;max-width:560px;font-size:18px;line-height:1.55;color:#3F3C36">수신자를 손으로 찾고, 엑셀을 하나씩 열고, 폴더를 일일이 만드는 일. 주소록·엑셀 한 장만 있으면 됩니다.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px">
      ${card('addr','01','주소록','대상 팀과 역할을 고르면 수신·참조 이메일 목록을 만들어 줍니다.')}
      ${card('xls','02','엑셀 취합','여러 폴더에 흩어진 같은 양식의 엑셀을 시트별로 한 파일에 모읍니다.')}
      ${card('folder','03','폴더 생성','엑셀 목록의 컬럼을 그대로 상위·하위 폴더 구조로 만들어 냅니다.')}
    </div>
  </div>`;
}

// ── 주소록 ──────────────────────────────────────────────────
function addrHtml(){
  const a = S.addr;
  const teams = a.teamsText.split(',').map(s=>s.trim()).filter(Boolean);
  const sel = a.target==='to' ? a.selTo : a.selCc;
  const avail = a.roles.filter(r=>sel.indexOf(r)<0);
  const roleRow = (r,inSel)=>{
    const badge = POSITION(r) ? `<span style="font-size:10px;font-weight:600;color:#7C5CB0;background:#ECE6F5;border-radius:999px;padding:2px 7px">직책</span>` : '';
    return `<button class="hoverbg" data-action="${inSel?'roleRemove':'roleAdd'}" data-role="${esc(r)}" style="width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:none;border-bottom:1px solid ${C.line};padding:11px 14px;font-size:13px;${inSel?'font-weight:600;':''}color:${C.ink2};cursor:pointer">
      <span>${esc(r)}</span>${badge}
      <span style="margin-left:auto;font-size:12px;color:${C.mute}">${inSel?'해제':'추가'}</span>
    </button>`;
  };

  const r = a.result;
  const hasResult = r && r.ok && !a.running && (r.to.length>0 || r.cc.length>0);
  const emptyResult = r && r.ok && !a.running && r.to.length===0 && r.cc.length===0;
  const detail = hasResult
    ? r.to.map(p=>({name:p.name,team:p.team,kind:'수신'})).concat(r.cc.map(p=>({name:p.name,team:p.team,kind:'참조'})))
    : [];

  return `
  <div>
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
      <span class="mono" style="font-size:11px;color:${C.mute}">01</span>
      <h2 style="margin:0;font-size:30px;font-weight:600;letter-spacing:-0.01em;color:${C.ink}">주소록</h2>
    </div>
    <p style="margin:0 0 32px;font-size:14px;line-height:1.55;color:${C.sub}">대상 팀과 역할을 지정하면 이메일 수신·참조 목록을 만듭니다.</p>

    <div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start">
      <div style="display:flex;flex-direction:column;gap:20px">

        <section class="card" style="padding:26px">
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
            <span class="mono" style="font-size:11px;color:${C.mute}">01</span>
            <span style="font-size:16px;font-weight:600">주소록 파일</span>
          </div>
          <p style="margin:0 0 16px;font-size:12px;line-height:1.55;color:${C.mute}">역할·팀·이메일과 상위조직(사업부·Level 1~3)이 정의된 최신 주소록 엑셀.</p>
          ${a.fileName ? `
            <div style="display:flex;align-items:center;gap:14px;background:${C.bg};border-radius:8px;padding:14px 16px">
              <span class="mono" style="font-size:13px;color:${C.ink2}">${esc(a.fileName)}</span>
              <span style="font-size:10px;font-weight:600;color:${C.ok};background:${C.okBg};border-radius:999px;padding:3px 9px">인식됨</span>
              <span class="mono" style="font-size:12px;color:${C.sub}">${a.rosterCount}명 · 역할 ${a.roles.length}종</span>
              <button class="linkbtn" data-action="pickRoster" style="margin-left:auto;font-size:13px;color:${C.sub};text-decoration:underline;text-underline-offset:4px">교체</button>
            </div>
            ${a.columns?`<p style="margin:12px 0 0;font-size:11px;color:${C.mute}">인식된 컬럼 — 팀: ${esc(a.columns.team)} · 역할: ${esc(a.columns.role)} · 이메일: ${esc(a.columns.email)}${a.columns.upper&&a.columns.upper.length?` · 상위: ${esc(a.columns.upper.filter(Boolean).join(' > '))}`:''}</p>`:''}
          ` : `
            <div data-action="pickRoster" style="${DROP_BASE}${a.errors.includes('file')?C.err:'#C9C6BC'}">
              <span style="font-size:14px;font-weight:600;color:${C.ink2}">클릭해서 주소록 엑셀을 선택하세요</span>
              <span style="font-size:12px;color:${C.mute}">.xlsx · .xlsm</span>
            </div>
            ${a.errors.includes('file')?`<p style="margin:12px 0 0;font-size:12px;color:${C.err}">주소록 파일이 필요합니다.</p>`:''}
          `}
        </section>

        <section class="card" style="padding:26px">
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
            <span class="mono" style="font-size:11px;color:${C.mute}">02</span>
            <span style="font-size:16px;font-weight:600">대상 팀</span>
          </div>
          <p style="margin:0 0 16px;font-size:12px;line-height:1.55;color:${C.mute}">쉼표로 나열합니다. <b>전체</b>=모든 팀 · <b>사업부명/담당명</b>=그 조직의 모든 팀 · <b>팀명</b>=해당 팀. (예: <span class="mono">전체</span> · <span class="mono">○○사업부</span> · <span class="mono">○○팀</span>)</p>
          <input data-field="teamsText" value="${esc(a.teamsText)}" placeholder="예: 전체  또는  ○○사업부, ○○팀" style="${INPUT_BASE}${a.errors.includes('teams')?C.err:C.line}">
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">
            ${teams.map(t=>`<span style="display:inline-flex;align-items:center;gap:8px;background:${C.wineBg};color:${C.wine};border-radius:999px;padding:5px 8px 5px 12px;font-size:12px;font-weight:600">${esc(t)}<button data-action="teamRemove" data-team="${esc(t)}" style="background:none;border:none;padding:0;width:16px;color:${C.wine};cursor:pointer;font-size:13px">×</button></span>`).join('')}
          </div>
          ${a.errors.includes('teams')?`<p style="margin:12px 0 0;font-size:12px;color:${C.err}">대상 팀을 한 개 이상 입력하세요.</p>`:''}
        </section>

        <section class="card" style="padding:26px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:6px">
            <div>
              <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
                <span class="mono" style="font-size:11px;color:${C.mute}">03</span>
                <span style="font-size:16px;font-weight:600">역할</span>
              </div>
              <p style="margin:0;font-size:12px;line-height:1.55;color:${C.mute};max-width:420px">항목을 클릭하면 옮겨집니다. <b style="color:#7C5CB0">직책</b> 역할(팀장·담당 등)은 대상 팀의 조직 경로 안에서만 취합됩니다.</p>
            </div>
            <div style="display:flex;flex:none;background:${C.bg};border-radius:8px;padding:3px">
              <button data-action="target" data-t="to" style="${a.target==='to'?SEG_ON:SEG_OFF}">수신</button>
              <button data-action="target" data-t="cc" style="${a.target==='cc'?SEG_ON:SEG_OFF}">참조</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:12px;align-items:stretch;margin-top:18px">
            <div>
              <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:12px;font-weight:600">전체 역할</span><span class="mono" style="font-size:11px;color:${C.mute}">${avail.length}</span></div>
              <div style="border:1px solid ${C.line};border-radius:8px;height:230px;overflow-y:auto;background:${C.canvas}">
                ${a.roles.length===0?`<div style="padding:20px 14px;font-size:12px;color:${C.mute}">주소록을 먼저 선택하세요.</div>`
                  : avail.length? avail.map(r=>roleRow(r,false)).join('') : `<div style="padding:20px 14px;font-size:12px;color:${C.mute}">모든 역할이 선택되었습니다.</div>`}
              </div>
            </div>
            <div style="display:flex;flex-direction:column;justify-content:center;gap:8px;padding-top:20px">
              <button class="hoverbg" data-action="addAll" title="모두 선택" style="width:40px;height:32px;border:1px solid #C9C6BC;background:#FFFFFF;border-radius:8px;cursor:pointer">→</button>
              <button class="hoverbg" data-action="removeAll" title="모두 해제" style="width:40px;height:32px;border:1px solid #C9C6BC;background:#FFFFFF;border-radius:8px;cursor:pointer">←</button>
            </div>
            <div>
              <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:12px;font-weight:600">${a.target==='to'?'수신 역할':'참조 역할'}</span><span class="mono" style="font-size:11px;color:${C.mute}">${sel.length}</span></div>
              <div style="border:1px solid ${a.errors.includes('roles')?C.err:C.line};border-radius:8px;height:230px;overflow-y:auto;background:#FFFFFF">
                ${sel.length? sel.map(r=>roleRow(r,true)).join('') : `<div style="padding:20px 14px;font-size:12px;color:${C.mute}">왼쪽에서 역할을 골라 주세요.</div>`}
              </div>
              ${a.errors.includes('roles')?`<p style="margin:10px 0 0;font-size:12px;color:${C.err}">수신 역할을 한 개 이상 선택하세요.</p>`:''}
            </div>
          </div>
        </section>
      </div>

      <aside class="card" style="position:sticky;top:0;padding:26px;display:flex;flex-direction:column;gap:18px">
        <div>
          <div style="font-size:16px;font-weight:600;margin-bottom:6px">실행 결과</div>
          <p style="margin:0;font-size:12px;line-height:1.55;color:${C.mute}">수신·참조를 각각 계산해 세미콜론(;)으로 이은 문자열로 만듭니다.</p>
        </div>
        <button class="run" data-action="runAddr" style="${RUN_BASE}${a.running?C.mute:C.wine};width:100%">${a.running?'계산 중…':'수신 · 참조 목록 생성'}</button>

        ${a.running?`<div style="display:flex;flex-direction:column;gap:10px">
          <div style="height:10px;border-radius:4px;background:${C.bg};animation:pulse 1.1s infinite"></div>
          <div style="height:10px;border-radius:4px;background:${C.bg};width:72%;animation:pulse 1.1s infinite .2s"></div>
          <div style="height:10px;border-radius:4px;background:${C.bg};width:45%;animation:pulse 1.1s infinite .4s"></div></div>`:''}

        ${r&&!r.ok&&!a.running?`<div style="background:${C.warnBg};border-radius:8px;padding:14px 16px">
          <div style="font-size:13px;font-weight:600;color:${C.warn};margin-bottom:6px">확인해 주세요</div>

// ── 이벤트 위임 ──────────────────────────────────────────────
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action;
  const a=S.addr, x=S.xls, f=S.fld;
  jlog('click action='+act+(el.dataset.key?(' key='+el.dataset.key):''));

  try{
  switch(act){
    case 'nav': S.screen = el.dataset.key; render(); break;

    // 주소록
    case 'pickRoster': {
      const res = await api('pick_roster');
      if(res.cancelled) break;
      if(!res.ok){ a.result={ok:false,error:res.error}; render(); break; }
      a.fileName=res.file_name; a.rosterCount=res.roster_count; a.roles=res.roles;
      a.teams=res.teams; a.columns=res.columns; a.result=null; a.errors=a.errors.filter(x=>x!=='file');
      render(); break;
    }
    case 'teamRemove': {
      const t=el.dataset.team;
      a.teamsText = a.teamsText.split(',').map(s=>s.trim()).filter(v=>v&&v!==t).join(', ');
      a.result=null; render(); break;
    }
    case 'target': a.target=el.dataset.t; render(); break;
    case 'roleAdd': { const r=el.dataset.role; (a.target==='to'?a.selTo:a.selCc).push(r); a.result=null; render(); break; }
    case 'roleRemove': { const r=el.dataset.role; const key=a.target==='to'?'selTo':'selCc'; a[key]=a[key].filter(v=>v!==r); a.result=null; render(); break; }
    case 'addAll': { const key=a.target==='to'?'selTo':'selCc'; a[key]=a.roles.slice(); a.result=null; render(); break; }
    case 'removeAll': { const key=a.target==='to'?'selTo':'selCc'; a[key]=[]; a.result=null; render(); break; }
    case 'runAddr': {
      const errs=[];
      if(!a.fileName) errs.push('file');
      if(a.teamsText.split(',').map(s=>s.trim()).filter(Boolean).length===0) errs.push('teams');
      if(a.selTo.length===0 && a.selCc.length===0) errs.push('roles');
      if(errs.length){ a.errors=errs; a.result=null; render(); break; }
      a.errors=[]; a.running=true; a.result=null; a.copied=null; render();
      const res = await api('run_recipients', a.teamsText, a.selTo, a.selCc);
      a.running=false; a.result=res; render(); break;
    }
    case 'copy': {
      const kind=el.dataset.kind; const r=a.result;
      if(r&&r.ok){ copyText(kind==='to'?r.to_join:r.cc_join); a.copied=kind; render(); setTimeout(()=>{a.copied=null;render();},1500); }
      break;
    }
    case 'saveAddr': { const res=await api('save_recipients_txt'); if(res.ok) await api('open_path', res.path); break; }

    // 엑셀 취합
    case 'pickXlsFolder': { const res=await api('pick_xls_folder'); if(res.ok){ x.folder=res.folder; x.errors=x.errors.filter(k=>k!=='folder'); render(); } break; }
    case 'toggleSub': x.sub=!x.sub; x.result=null; render(); break;
    case 'runXls': {
      const errs=[];
      if(!x.folder) errs.push('folder');
      if(!x.prefix.trim()) errs.push('prefix');
      if(!x.sheets.trim()) errs.push('sheets');
      if(!x.headers.trim()) errs.push('headers');
      if(errs.length){ x.errors=errs; x.result=null; render(); break; }
      x.errors=[]; x.running=true; x.result=null; render();
      const res=await api('run_xls_merge', x.folder, x.prefix.trim(), x.sheets.trim(), x.headers.trim(), x.sub);
      x.running=false; x.result=res; render(); break;
    }
    case 'openPath': await api('open_path', el.dataset.path); break;

    // 폴더 생성
    case 'pickFolderExcel': {
      const res=await api('pick_folder_excel');
      if(res.cancelled) break;
      if(!res.ok){ f.result={ok:false,error:res.error}; render(); break; }
      f.fileName=res.file_name; f.sheets=res.sheets; f.result=null; f.errors=[];
      const first=f.sheets.find(s=>s.headers.length) || f.sheets[0];
      f.sheet=first?first.name:''; const h=first?first.headers:[];
      f.top=h[0]||''; f.sub=h[1]||'(없음)';
      await refreshTree(); render(); break;
    }
    case 'numMode': f.numMode=el.dataset.v; await refreshTree(); render(); break;
    case 'pickOutput': { const res=await api('pick_output_dir'); if(res.ok){ f.outputDir=res.path; f.errors=f.errors.filter(k=>k!=='output'); render(); } break; }
    case 'runFolder': {
      if(!f.outputDir){ f.errors=['output']; render(); break; }
      f.errors=[]; f.running=true; f.result=null; render();
      const res=await api('run_create_folders', f.sheet, f.top, f.sub, f.numMode, f.outputDir);
      f.running=false; f.result=res; render(); break;
    }
  }
  }catch(err){ jlog('click handler EXC ['+act+']: '+((err&&err.message)||err)); }
});

// input / select 변경
document.addEventListener('input', (e)=>{
  const el=e.target.closest('[data-field]'); if(!el) return;
  const fld=el.dataset.field;
  if(fld==='teamsText'){ S.addr.teamsText=el.value; S.addr.result=null; }
  else if(['prefix','sheets','headers'].includes(fld)){ S.xls[fld]=el.value; S.xls.result=null; }
});
document.addEventListener('change', async (e)=>{
  const el=e.target.closest('[data-field]'); if(!el) return;
  const fld=el.dataset.field; const f=S.fld;
  if(fld==='sheet'){ f.sheet=el.value; const cur=f.sheets.find(s=>s.name===f.sheet); const h=cur?cur.headers:[]; f.top=h[0]||''; f.sub=h[1]||'(없음)'; f.result=null; await refreshTree(); render(); }
  else if(fld==='top'){ f.top=el.value; const cur=f.sheets.find(s=>s.name===f.sheet); const h=cur?cur.headers:[]; const ti=h.indexOf(f.top); const rest=ti>=0?h.slice(ti+1):[]; f.sub=rest[0]||'(없음)'; f.result=null; await refreshTree(); render(); }
  else if(fld==='sub'){ f.sub=el.value; f.result=null; await refreshTree(); render(); }
});

async function refreshTree(){
  const f=S.fld;
  if(!f.fileName||!f.top){ f.preview=null; return; }
  try{
    const res=await api('preview_folder_tree', f.sheet, f.top, f.sub, f.numMode);
    f.preview = res.ok ? res : null;
    if(!res.ok) f.result={ok:false,error:res.error};
  }catch(e){ f.preview=null; }
}

// ── 시작 ────────────────────────────────────────────────────
let _booted=false;
function boot(){
  if(_booted) return; _booted=true;
  jlog('boot 시작');
  try{ render(); jlog('boot 완료 (첫 렌더 성공, app_len='+app.innerHTML.length+')'); }
  catch(err){ jlog('boot RENDER 예외: '+((err&&err.stack)||err)); }
}
jlog('script 로드됨, pywebview='+(!!(window.pywebview&&window.pywebview.api)));
if(window.pywebview && window.pywebview.api){ boot(); }
else { window.addEventListener('pywebviewready', ()=>{ jlog('pywebviewready 이벤트 수신'); boot(); }); setTimeout(()=>{ if(!_booted){ jlog('1200ms fallback boot'); boot(); } }, 1200); }
</script>
